name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests (no models, no GPU work)
        working-directory: engine
        run: uv run --frozen pytest -q

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test DMLXKit + app
        working-directory: app
        run: swift test
