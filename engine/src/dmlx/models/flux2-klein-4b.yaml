id: flux2-klein-4b
name: FLUX.2 Klein 4B
adapter: mflux.flux2_klein
repo: mflux-community/flux2-klein-4b-mflux-q4
quantization: 4
license: apache-2.0
tasks: [t2i, edit]
max_references: 3
min_ram_gb: 16
components:
  text_encoder: { phase: encode, share_key: qwen3-4b-q4 }
  transformer:  { phase: denoise }
  vae:          { phase: decode, keep: true }
defaults: { steps: 4, guidance: 1.0, width: 1024, height: 1024 }
# Activation memory at 1024x1024 measured in B1; scales with pixel count.
activation_gb_per_mp: 1.2
