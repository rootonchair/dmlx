id: z-image-turbo
name: Z-Image Turbo
adapter: mflux.z_image
repo: mflux-community/z-image-turbo-mflux-q4
quantization: 4
agent_note: "New images only; fast, with more photographic detail than Klein; weak at drawing exact words."
license: apache-2.0
tasks: [t2i]
max_references: 0
capabilities:
  image.generate:
    inputs: {}
    prompt: { positive: true, negative: false }
min_ram_gb: 16
components:
  text_encoder: { phase: encode, share_key: qwen3-4b-q4, stream: [layers] }
  transformer:  { phase: denoise, stream: [noise_refiner, context_refiner, layers] }
  vae:          { phase: decode, keep: true }
defaults: { steps: 9, guidance: 0.0, width: 1024, height: 1024 }
# Measured on M5 at 1024x1024 (docs/benchmarks/b1.md).
activation_gb_per_mp: 1.0
decode_gb_per_mp: 6.7
decode_tiled_gb_per_mp: 2.0
