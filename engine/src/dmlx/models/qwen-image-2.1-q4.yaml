id: qwen-image-2.1-q4
name: Qwen Image 2.1 Base Q4
adapter: mflux.qwen_image_21
mflux_config: qwen_image_21
repo: OsaurusAI/Qwen-Image-2.1-mflux-4bit
revision: 235fd28de40d745382e9d7a33f008c7735ec21c2
quantization: 4
agent_note: "Pick it only when the image must contain exact words (titles, signs, labels) or for precise edits with several images: it is slow (about 4 minutes, against 30 s) and needs about 9.5 GB free. Research license, not for commercial use."
license: qwen-research
license_url: https://huggingface.co/Qwen/Qwen-Image-2.1/blob/main/LICENSE
license_acceptance_id: qwen-research-2026-09-20
auto_select: false
experimental: true
tasks: [t2i, edit]
max_references: 10
min_steps: 2
capabilities:
  image.generate:
    inputs: {}
    prompt: { positive: true, negative: true }
  image.edit:
    inputs:
      image: { min: 1, max: 10, ordered: true }
    prompt: { positive: true, negative: true }
min_ram_gb: 16
components:
  # Qwen3.5-0.8B + the zen-image-edit fusion adapter replaces Qwen3-VL-8B.
  # It is fetched by mflux and is intentionally not another user-facing model.
  text_encoder: { phase: encode, external: true, size_gb: 2.4 }
  transformer:  { phase: denoise }
  vae:          { phase: decode, keep: true }
defaults: { steps: 40, guidance: 4.0, width: 1024, height: 1024 }
# Measured sequential peaks on the 24 GB gate; references carry extra vision/VAE activations.
activation_gb_per_mp: 1.3
reference_activation_factor: 2.2
decode_gb_per_mp: 8.0
decode_tiled_gb_per_mp: 1.3
